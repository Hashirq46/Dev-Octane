{% extends "base.html" %}

{% block title %}Password Reset Complete — JobPortal{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 text-center">
        <div class="card shadow-sm border-0 py-5 px-4">
            <div class="card-body">
                <div class="display-3 text-success mb-3">
                    <i class="bi bi-check-circle"></i>
                </div>
                <h2 class="fw-bold mb-3">Password Changed!</h2>
                <p class="text-muted mb-4">
                    Your password has been successfully updated. You may now sign in with your new password.
                </p>
                <div>
                    <a href="{% url 'login' %}" class="btn btn-primary btn-lg">Sign In</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
