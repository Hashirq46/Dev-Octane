{% extends "base.html" %}

{% block title %}Invalid or Expired Link — JobPortal{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 text-center">
        <div class="card shadow-sm border-0 py-5 px-4">
            <div class="card-body">
                <div class="display-3 text-warning mb-3">
                    <i class="bi bi-exclamation-triangle"></i>
                </div>
                <h2 class="fw-bold mb-3">Invalid or Expired Link</h2>
                <p class="text-muted mb-4">
                    The confirmation link you clicked is either invalid, already used, or has expired.
                </p>
                <div class="d-flex justify-content-center gap-3">
                    <a href="{% url 'resend_confirmation' %}" class="btn btn-primary">Resend Confirmation Link</a>
                    <a href="{% url 'login' %}" class="btn btn-outline-secondary">Sign In</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
