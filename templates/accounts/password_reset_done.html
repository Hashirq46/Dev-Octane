{% extends "base.html" %}

{% block title %}Password Reset Sent — JobPortal{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 text-center">
        <div class="card shadow-sm border-0 py-5 px-4">
            <div class="card-body">
                <div class="display-3 text-info mb-3">
                    <i class="bi bi-envelope-arrow-up"></i>
                </div>
                <h2 class="fw-bold mb-3">Password Reset Sent</h2>
                <p class="text-muted mb-4">
                    If an account exists with the email address you provided, you will receive password reset instructions shortly.
                </p>
                <div>
                    <a href="{% url 'login' %}" class="btn btn-outline-primary">Return to Sign In</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
